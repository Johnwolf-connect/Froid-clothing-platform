<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#234157" />
  <title>Froid — New Collection</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="wordmark" href="#top" aria-label="Froid home">
        <img src="./public/brand/froid-ice-logo.webp" alt="Froid" />
      </a>
      <nav class="topnav" aria-label="Primary navigation">
        <a href="#collection">Collection</a>
        <a href="#collection">Outerwear</a>
        <a href="#campaign">Campaign</a>
      </nav>
      <div class="top-actions">
        <button class="icon-button" type="button" aria-label="Search" data-focus-search>⌕</button>
        <button class="bag" type="button">Bag <span>00</span></button>
      </div>
    </header>

    <main id="top">
      <section class="hero" id="campaign" aria-label="Froid Wear campaign">
        <img src="./public/brand/froid-wear-hero.webp" alt="Froid Wear campaign in an icy mountain landscape" />
      </section>

      <section class="collection" id="collection">
        <div class="collection-heading">
          <div>
            <p class="eyebrow">FROID / DROP 01 / 2026</p>
            <h1>NEW COLLECTION</h1>
          </div>
          <div class="collection-note">
            <span>REF: FW26_01</span>
            <span>NORTH / 07°</span>
            <span>CONTROL: COLD_ICE</span>
          </div>
        </div>

        <div class="collection-layout">
          <aside class="campaign-card" id="aurora">
            <div class="campaign-grid"></div>
            <div class="campaign-copy">
              <p class="eyebrow">FROID LAB / 01</p>
              <h2>AURORA™</h2>
              <p>THERMAL SHELL / REFLECTIVE SURFACE</p>
              <div class="campaign-price">$1,999</div>
            </div>
            <img class="campaign-model" src="./public/models/model-fur.webp" alt="Model in Froid fur outerwear" />
            <img class="campaign-logo" src="./public/brand/froid-logo.webp" alt="" />
          </aside>

          <div class="catalog-area">
            <div class="catalog-toolbar">
              <label class="search-control">
                <span>SEARCH</span>
                <input id="product-search" type="search" placeholder="STYLE / COLOR / CODE" autocomplete="off" />
              </label>
              <div class="filter-group" aria-label="Product filters">
                <button class="filter is-active" type="button" data-filter="all">ALL</button>
                <button class="filter" type="button" data-filter="light">LIGHT</button>
                <button class="filter" type="button" data-filter="dark">DARK</button>
                <button class="filter" type="button" data-filter="color">COLOR</button>
              </div>
            </div>

            <div class="product-landscape" aria-live="polite">
              <img class="ambient-mountains" src="./public/platforms/mountain-range.webp" alt="" />
              <div class="collection-row row-a" id="row-a"></div>
              <div class="collection-row row-b" id="row-b"></div>
              <p class="empty-state" id="empty-state" hidden>NO ITEMS MATCH THIS FILTER.</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <template id="product-template">
    <article class="product-card">
      <div class="stage">
        <img class="mountain-stage" alt="" />
        <img class="platform-fill" alt="" hidden />
        <img class="product-model" alt="" />
      </div>
      <div class="product-info">
        <div>
          <h3></h3>
          <p class="product-subtitle"></p>
        </div>
        <p class="product-price"></p>
      </div>
      <div class="product-meta">
        <span class="product-code"></span>
        <span class="swatch"></span>
        <span class="product-color"></span>
      </div>
    </article>
  </template>

  <script src="./script.js"></script>
</body>
</html>
